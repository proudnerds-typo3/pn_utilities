<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate key="title" /></h1>

    <f:if condition="{page}">
        <f:then>
            <p><f:translate key="intro" arguments="{0: page.title}" /></p>
            <p><f:translate key="limitation" /></p>

            <f:form action="index" method="post" class="mb-4">
                <input type="hidden" name="id" value="{page.uid}" />
                <div class="row g-2 align-items-end">
                    <div class="col-auto">
                        <label for="pn-utilities-days" class="form-label"><f:translate key="days.label" /></label>
                        <f:form.textfield type="number" name="days" id="pn-utilities-days" value="{days}" class="form-control" additionalAttributes="{min: 1, max: 36500}" />
                    </div>
                    <div class="col-auto">
                        <f:form.submit value="{f:translate(key: 'submit')}" class="btn btn-primary" />
                    </div>
                </div>
            </f:form>

            <h2><f:translate key="total" arguments="{0: total, 1: days}" /></h2>

            <f:if condition="{rows}">
                <f:then>
                    <div class="table-fit">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th scope="col" class="col-title"><f:translate key="column.title" /></th>
                                    <th scope="col"><f:translate key="column.lastChange" /></th>
                                    <th scope="col"><f:translate key="column.uid" /></th>
                                    <th scope="col"><f:translate key="column.pid" /></th>
                                    <th scope="col"><f:translate key="column.language" /></th>
                                    <th scope="col" class="col-control"><f:translate key="column.actions" /></th>
                                </tr>
                            </thead>
                            <tbody>
                                <f:for each="{rows}" as="row">
                                    <tr>
                                        <td class="col-title">
                                            <f:if condition="{row.uri}">
                                                <f:then>
                                                    <a href="{row.uri}" target="_blank" rel="noopener">{row.page.title}<span class="visually-hidden"> <f:translate key="opensInNewTab" /></span></a>
                                                </f:then>
                                                <f:else>{row.page.title}</f:else>
                                            </f:if>
                                            <f:if condition="{row.page.hidden}">
                                                <span class="badge badge-warning"><f:translate key="hidden" /></span>
                                            </f:if>
                                        </td>
                                        <td><f:format.date format="d-m-Y">{row.page.lastChanged}</f:format.date></td>
                                        <td>{row.page.uid}</td>
                                        <td>{row.page.pid}</td>
                                        <td>{row.page.languageId}</td>
                                        <td class="col-control">
                                            <f:variable name="editLabel"><f:translate key="edit" arguments="{0: row.page.title}" /></f:variable>
                                            <a href="{be:moduleLink(route: 'web_layout', arguments: '{id: row.page.defaultLanguageUid}')}" class="btn btn-default" title="{editLabel}">
                                                <core:icon identifier="actions-open" />
                                                <span class="visually-hidden">{editLabel}</span>
                                            </a>
                                        </td>
                                    </tr>
                                </f:for>
                            </tbody>
                        </table>
                    </div>
                    <f:render section="Pagination" arguments="{_all}" />
                </f:then>
                <f:else>
                    <p><f:translate key="none" /></p>
                </f:else>
            </f:if>
        </f:then>
        <f:else>
            <p><f:translate key="error.noPageSelected" /></p>
        </f:else>
    </f:if>
</f:section>

<f:section name="Pagination">
    <f:if condition="{paginator.numberOfPages} > 1">
        <nav aria-label="{f:translate(key: 'pagination.label')}">
            <ul class="pagination">
                <f:if condition="{pagination.previousPageNumber}">
                    <li class="page-item">
                        <f:link.action action="index" arguments="{days: days}" additionalParams="{id: page.uid}" class="page-link"><f:translate key="pagination.first" /></f:link.action>
                    </li>
                    <li class="page-item">
                        <f:link.action action="index" arguments="{days: days, currentPage: pagination.previousPageNumber}" additionalParams="{id: page.uid}" class="page-link" rel="prev"><f:translate key="pagination.previous" /></f:link.action>
                    </li>
                </f:if>
                <li class="page-item">
                    <span class="page-link"><f:translate key="pagination.status" arguments="{0: paginator.currentPageNumber, 1: paginator.numberOfPages, 2: pagination.startRecordNumber, 3: pagination.endRecordNumber}" /></span>
                </li>
                <f:if condition="{pagination.nextPageNumber}">
                    <li class="page-item">
                        <f:link.action action="index" arguments="{days: days, currentPage: pagination.nextPageNumber}" additionalParams="{id: page.uid}" class="page-link" rel="next"><f:translate key="pagination.next" /></f:link.action>
                    </li>
                    <li class="page-item">
                        <f:link.action action="index" arguments="{days: days, currentPage: pagination.lastPageNumber}" additionalParams="{id: page.uid}" class="page-link"><f:translate key="pagination.last" /></f:link.action>
                    </li>
                </f:if>
            </ul>
        </nav>
    </f:if>
</f:section>

</html>
